name: WebAssembly

on:
  push:
    paths:
      - ".github/workflows/wasm.yml"
      - "csharp/wwwroot/**"
      - "wasm/**"
      - "Makefile"
  pull_request:
    paths:
      - ".github/workflows/wasm.yml"
      - "csharp/wwwroot/**"
      - "wasm/**"
      - "Makefile"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wasm/package-lock.json
      - run: npm ci
        working-directory: wasm
      - run: npm test
        working-directory: wasm
      - run: npm run build
        working-directory: wasm
      - name: Check shared .NET client bundle
        run: git diff --exit-code -- csharp/wwwroot/assets/r2wars-ui.js
      - uses: actions/upload-artifact@v7
        with:
          name: r2wars-wasm
          path: wasm/dist
          if-no-files-found: error
          retention-days: 7
